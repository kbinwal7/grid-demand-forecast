<section class="panel forecast-panel" data-panel aria-labelledby="forecast-chart-title">
  <div class="panel-heading">
    <div><h2 id="forecast-chart-title">Day-ahead forecast · 96 intervals</h2><p id="forecast-chart-note">Forecast, actual demand when available, and prediction intervals.</p></div>
    <span class="unit-pill">MW</span>
  </div>
  <div id="forecast-chart-root" class="chart-root" data-chart-root>
    <p class="chart-state" data-chart-state role="status" aria-live="polite">Loading forecast…</p>
    <div id="forecast-chart" class="chart" data-chart aria-label="Day-ahead demand forecast with optional q10 to q90 interval" role="img"></div>
  </div>
  <div class="chart-footnote"><span><i class="legend-dot forecast-dot"></i> Forecast</span><span><i class="legend-band"></i> q10–q90 interval</span><span><i class="legend-line actual-line"></i> Actual (when available)</span></div>
</section>

<section class="panel" data-panel aria-labelledby="forecast-temperature-title">
  <div class="panel-heading"><div><h2 id="forecast-temperature-title">Weather temperature</h2><p id="temperature-chart-note">Daily maximum from available weather data.</p></div><span class="unit-pill">°C</span></div>
  <div id="forecast-temperature-root" class="chart-root" data-chart-root>
    <p class="chart-state" data-chart-state role="status" aria-live="polite">Loading weather…</p>
    <div id="forecast-temperature-chart" class="chart" data-chart aria-label="Daily maximum temperature for the selected forecast date" role="img"></div>
  </div>
</section>
