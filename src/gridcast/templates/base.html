<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="csp-nonce" content="{{ csp_nonce }}" />
    <title>Grid Demand Forecast | GridCast</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}" />
    <script
      defer
      src="{{ url_for('static', path='js/plotly-style-nonce.js') }}"
    ></script>
    <script
      defer
      src="{{ url_for('static', path='vendor/plotly-cartesian-2.35.2.min.js') }}"
    ></script>
    <script
      type="module"
      src="{{ url_for('static', path='js/dashboard.js') }}"
    ></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <main id="main-content" class="main-content">
      <header class="topbar">
        <a class="brand" href="/" aria-label="GridCast dashboard">
          <span class="brand-icon" aria-hidden="true">G</span>
          <h1>GridCast</h1>
        </a>
        <form
          id="dashboard-controls"
          class="dashboard-controls"
          aria-label="Dashboard controls"
        >
          <label class="visually-hidden" for="global-model-select">Model</label>
          <select id="global-model-select" name="model_id" aria-label="Model">
            <option value="">Loading models…</option>
          </select>
          <label class="visually-hidden" for="global-date-select"
            >Forecast date</label
          >
          <input
            id="global-date-select"
            name="date"
            type="date"
            required
            aria-label="Forecast date"
          />
          <button
            id="dashboard-refresh"
            class="refresh-button"
            type="button"
            aria-label="Refresh active tab"
          >
            ↻ <span>Refresh</span>
          </button>
          <span
            id="dashboard-source-badge"
            class="source-badge"
            aria-live="polite"
            >Source: live + backtest</span
          >
        </form>
        <p
          id="dashboard-notice"
          class="dashboard-notice"
          role="status"
          aria-live="polite"
          hidden
        ></p>
      </header>

      <section class="page-content">{% block content %}{% endblock %}</section>
      <footer class="site-footer">
        <span>GridCast · Indian electricity demand forecasting</span
        ><a href="https://open-meteo.com/" target="_blank" rel="noreferrer"
          >Weather data by Open-Meteo.com</a
        >
      </footer>
    </main>
  </body>
</html>
