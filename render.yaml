services:
  - type: web
    name: gridcast-dashboard
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: gridcast-dashboard.onrender.com,*.onrender.com
      - key: RATE_LIMIT
        value: 60/minute
