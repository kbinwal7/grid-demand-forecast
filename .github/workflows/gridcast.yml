name: GridCast Pipeline

on:
  schedule:
    # Daily at 7:00 AM IST (01:30 UTC)
    - cron: "30 1 * * *"
    # Sunday at 8:00 AM IST (02:30 UTC)
    - cron: "30 2 * * 0"
    # Every 3 hours: catch-up. Does nothing unless a forecast is missing, so it
    # recovers days lost while the VM/runner was offline as soon as it is back.
    - cron: "15 */3 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Pipeline job to run manually"
        required: true
        type: choice
        options:
          - daily
          - weekly
          - catchup

permissions:
  contents: read

concurrency:
  group: gridcast-pipeline
  cancel-in-progress: false

jobs:
  daily:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '30 1 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'daily')
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Grid-India connectivity
        run: |
          python -c "import socket; print('DNS:', socket.gethostbyname_ex('webapi.grid-india.in'))"
          python -c "import requests; u='https://webapi.grid-india.in/api/v1/file'; p={'_source':'GRDW','_type':'DAILY_PSP_REPORT','_fileDate':'2026-27','_month':'10'}; r=requests.post(u,json=p,headers={'User-Agent':'Mozilla/5.0','Content-Type':'application/json'},timeout=30); print('HTTP:',r.status_code); print(r.text[:300])"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project dependencies
        run: uv sync --frozen --no-dev

      - name: Run daily ingestion and forecast
        env:
          ADMIN_DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
        run: uv run --no-sync python scripts/run_pipeline.py daily

  weekly:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '30 2 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'weekly')
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Grid-India connectivity
        run: |
          python -c "import socket; print('DNS:', socket.gethostbyname_ex('webapi.grid-india.in'))"
          python -c "import requests; u='https://webapi.grid-india.in/api/v1/file'; p={'_source':'GRDW','_type':'DAILY_PSP_REPORT','_fileDate':'2026-27','_month':'10'}; r=requests.post(u,json=p,headers={'User-Agent':'Mozilla/5.0','Content-Type':'application/json'},timeout=30); print('HTTP:',r.status_code); print(r.text[:300])"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project dependencies
        run: uv sync --frozen --no-dev

      - name: Run weekly ingestion and retraining
        env:
          ADMIN_DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
        run: uv run --no-sync python scripts/run_pipeline.py weekly

  catchup:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '15 */3 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'catchup')
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project dependencies
        run: uv sync --frozen --no-dev

      - name: Forecast any missed days
        env:
          ADMIN_DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
        run: uv run --no-sync python scripts/run_pipeline.py catchup
