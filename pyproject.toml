[project]
name = "gridcast"
version = "0.1.0"
description = "Day-ahead Indian electricity demand forecasting with a FastAPI dashboard"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "kbinwal7", email = "khusheebinwal29@gmail.com" }]
dependencies = [
    # web app (backend + server-rendered frontend)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    # database
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "tzdata",  # IANA timezones for zoneinfo on Windows
    # data + modelling pipeline
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "requests>=2.31",
    "holidays>=0.50",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    # Grid-India Excel parsing (scraper)
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-calamine>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]
notebooks = ["jupyterlab>=4.0", "ipykernel>=6.0", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
